version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm install
        build:
          commands:
            - npx ng build --configuration production
      artifacts:
        baseDirectory: dist/shopzee-frontend/browser
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    appRoot: frontend/shopzee-frontend
