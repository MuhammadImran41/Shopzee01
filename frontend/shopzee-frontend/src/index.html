<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>STYLEMAKER Premium Pakistani Fashion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="STYLEMAKER Premium men's and women's Pakistani fashion. Luxury embroidered suits, shalwar kameez, and formal wear.">
  <meta name="theme-color" content="#C9A84C">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Preload Hero Poster Image for fast LCP -->
  <link rel="preload" as="image" href="assets/images/women/women-1.png" type="image/png">

  <!-- Preconnect to font origins — reduces connection latency -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Fonts asynchronously -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
    media="print"
    onload="this.media='all'"
  >
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    >
  </noscript>

  <base href="/">
  
  <!-- Prevent FOUC - Hide content until Angular loads -->
  <style>
    /* Critical CSS - Inline for instant load */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F5F0E8;
      overflow-x: hidden;
    }
    
    /* Hide app root until Angular bootstraps */
    app-root:empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #F5F0E8;
    }
    
    /* Loading spinner */
    app-root:empty::before {
      content: '';
      width: 48px;
      height: 48px;
      border: 4px solid rgba(201,168,76,0.2);
      border-top-color: #C9A84C;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Hide empty app-root after content loads */
    app-root:not(:empty) {
      display: block;
    }
  </style>
</head>
<body>
  <app-root>
    <!-- Loading fallback - shown while Angular bootstraps -->
    <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #F5F0E8; flex-direction: column; gap: 1rem;">
      <svg width="80" height="80" viewBox="0 0 160 40" style="transform: scale(2);" aria-hidden="true">
        <path d="M8 28L4 14l8 6 8-12 8 12 8-6-4 14H8z"
          fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="4"  cy="14" r="2" fill="#C9A84C"/>
        <circle cx="20" cy="8"  r="2" fill="#C9A84C"/>
        <circle cx="36" cy="14" r="2" fill="#C9A84C"/>
      </svg>
      <div style="color: #8B7355; font-size: 0.875rem; letter-spacing: 0.1em;">Loading StyleMaker...</div>
    </div>
  </app-root>
</body>
</html>
