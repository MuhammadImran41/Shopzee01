<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trendzy — Premium Pakistani Fashion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Trendzy — Premium men's and women's Pakistani fashion. Luxury embroidered suits, shalwar kameez, and formal wear.">
  <meta name="theme-color" content="#C9A84C">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Preload Hero Poster Image for fast LCP -->
  <link rel="preload" as="image" href="assets/images/women/women-1.png" type="image/png">

  <!-- Preconnect to font origins — reduces connection latency -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Fonts asynchronously -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
    media="print"
    onload="this.media='all'"
  >
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    >
  </noscript>

  <base href="/">
</head>

</body>
</html>
