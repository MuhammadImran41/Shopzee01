name: Deploy Backend to Elastic Beanstalk

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/Shopzee.API/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: |
          cd backend/Shopzee.API
          dotnet publish -c Release -o publish --self-contained false -r linux-x64

      - name: Create Procfile
        run: echo "web: ./Shopzee.API" > backend/Shopzee.API/publish/Procfile

      - name: Zip artifact
        run: |
          cd backend/Shopzee.API/publish
          zip -r $GITHUB_WORKSPACE/shopzee-api.zip .

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: shopzee-api
          environment_name: Shopzee-api-env
          region: us-east-1
          version_label: "v${{ github.run_number }}"
          deployment_package: shopzee-api.zip
