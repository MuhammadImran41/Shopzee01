version: 1.0
runtime: dotnet8
build:
  commands:
    build:
      - dotnet publish Shopzee.API.csproj -c Release -o out
run:
  command: dotnet out/Shopzee.API.dll
  network:
    port: 8080
  env:
    - name: ASPNETCORE_URLS
      value: "http://0.0.0.0:8080"
    - name: ASPNETCORE_ENVIRONMENT
      value: "Production"
